<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ryan Hulvey's portfolio website.">
  <title>Ryan Hulvey | Portfolio</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; padding-top: 73px; }
    a { color: #4b7f8e; }
    a:focus-visible, button:focus-visible { outline: 3px solid #347a96; outline-offset: 3px; }

    .top-bar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      min-height: 73px;
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr auto;
      align-items: center;
      gap: 20px;
      padding: 8px 16px 8px 24px;
      border: 1px solid #111;
      background: #fff;
    }

    .name {
      color: #111;
      font-size: clamp(1.3rem, 3vw, 2.15rem);
      text-decoration: none;
      white-space: nowrap;
    }

    .social-link {
      justify-self: center;
      font-size: clamp(1.15rem, 3vw, 2.15rem);
      white-space: nowrap;
    }

    .menu-wrap { position: relative; justify-self: end; }
    .menu-button {
      width: 58px;
      height: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
      padding: 4px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .menu-button span { display: block; width: 100%; height: 9px; background: #050505; }

    .menu-panel {
      position: absolute;
      top: calc(100% + 13px);
      right: -1px;
      width: 220px;
      padding: 8px;
      border: 1px solid #111;
      background: #fff;
      box-shadow: 0 8px 20px rgb(0 0 0 / 14%);
    }
    .menu-panel[hidden] { display: none; }
    .menu-panel a {
      display: block;
      padding: 12px 14px;
      color: #111;
      font-size: 1.05rem;
      text-decoration: none;
    }
    .menu-panel a:hover { background: #eef4f5; }

    main { min-height: calc(100vh - 73px); }
    .profile {
      display: flex;
      align-items: center;
      flex-direction: column;
      padding: 40px 20px 48px;
      text-align: center;
    }
    .photo-placeholder {
      width: min(342px, 85vw);
      height: 323px;
      display: grid;
      place-items: center;
      border: 2px solid #173b4c;
      font-size: 1.35rem;
    }
    .major {
      margin: 2px 0 12px;
      font-size: clamp(1.25rem, 2.5vw, 1.65rem);
      font-weight: 400;
      line-height: 1.3;
    }
    .bio {
      max-width: 485px;
      margin: 0;
      font-size: clamp(1.1rem, 2.2vw, 1.45rem);
      line-height: 1.28;
    }

    @media (max-width: 680px) {
      body { padding-top: 65px; }
      .top-bar {
        min-height: 65px;
        grid-template-columns: 1fr auto;
        gap: 4px 10px;
        padding: 7px 12px;
      }
      .name { grid-column: 1; grid-row: 1; }
      .social-link { display: none; }
      .menu-wrap { grid-column: 2; grid-row: 1; }
      .menu-button { width: 48px; height: 44px; gap: 6px; }
      .menu-button span { height: 7px; }
      .profile { padding-top: 32px; }
      .photo-placeholder { height: min(323px, 78vw); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <a class="name" href="#home">Ryan Hulvey</a>
    <!-- Replace the example email and LinkedIn URL with your own profile details. -->
    <a class="social-link" href="mailto:rchulvey@smcm.edu">Email</a>
    <a class="social-link" href="https://www.linkedin.com/">LinkedIn</a>
    <a class="social-link" href="https://github.com/RyanCHulvey">GitHub</a>

    <div class="menu-wrap">
      <button class="menu-button" id="menu-button" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="quick-menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="menu-panel" id="quick-menu" aria-label="Quick navigation" hidden>
        <a href="#home">Home</a>
        <a href="#about">About me</a>
      </nav>
    </div>
  </header>

  <main id="home">
    <section class="profile" id="about" aria-label="Introduction">
      <div class="photo-placeholder" role="img" aria-label="Photo of Ryan placeholder">Photo of Face</div>
      <h1 class="major">Computer Science/Mathematics Major</h1>
      <p class="bio">Currently enrolled at St. Mary’s College of Maryland. Overall, a charismatic and aspiring learner driven to help others and make meaningful contributions to my community.</p>
    </section>
  </main>

  <script>
    const menuButton = document.getElementById('menu-button');
    const quickMenu = document.getElementById('quick-menu');

    function setMenuOpen(isOpen) {
      quickMenu.hidden = !isOpen;
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
    }

    menuButton.addEventListener('click', () => {
      setMenuOpen(menuButton.getAttribute('aria-expanded') !== 'true');
    });

    quickMenu.addEventListener('click', (event) => {
      if (event.target.closest('a')) setMenuOpen(false);
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.menu-wrap')) setMenuOpen(false);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setMenuOpen(false);
        menuButton.focus();
      }
    });
  </script>
</body>
</html>
